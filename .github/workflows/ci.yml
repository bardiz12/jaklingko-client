name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Verify Dependencies
        run: |
          go mod verify
          git diff --exit-code go.mod go.sum || true

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Tests with Race Detector
        run: go test -v -race ./...

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { name: "CLI", path: "./cmd/cli" }
          - { name: "MCP", path: "./cmd/mcp" }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Compile ${{ matrix.target.name }}
        run: go build -v ${{ matrix.target.path }}
